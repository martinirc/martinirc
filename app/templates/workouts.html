{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Registrar nueva sesión</h2>
  <form method="post" class="form-grid">
    <label>
      Fecha
      <input type="date" name="session_date" required>
    </label>
    <label>
      Enfoque
      <input type="text" name="focus" placeholder="Pecho, Piernas, Full body...">
    </label>
    <label class="span-2">
      Notas
      <textarea name="notes" rows="2" placeholder="Sensaciones, objetivos específicos..."></textarea>
    </label>
    <button type="submit" class="button primary">Guardar sesión</button>
  </form>
</section>
<section class="card">
  <h2>Historial</h2>
  <ul class="list">
    {% for workout in workouts %}
      <li>
        <div>
          <strong>{{ workout.session_date.strftime('%d/%m/%Y') }}</strong>
          — {{ workout.focus }}
        </div>
        <a class="button" href="{{ url_for('workout_detail', session_id=workout.id) }}">Detalles</a>
      </li>
    {% else %}
      <li>Aún no hay sesiones registradas.</li>
    {% endfor %}
  </ul>
</section>
{% endblock %}
